<!DOCTYPE html>
<html>
<head>
    <title>Computer Engineering Chatbot</title>
</head>

<body>

    <h1>🎓 Computer Engineering Department</h1>

    <h2>WhatsApp Chatbot</h2>

    <form action="/chat" method="POST">

        <input

            name="message"
            placeholder="Type your message"
            required

        <button type="submit">
            Send
        </button>

    </form>
