<!DOCTYPE html>
<html>
<head>

    <title>CE WhatsApp Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="header">
        🎓 Computer Engineering Department
        <br>
        WhatsApp Chatbot
    </div>

    <div class="chat-box">

        {% if chat_history %}

            {% for msg in chat_history %}

                <div class="{{ msg.sender }}">
                    {{ msg.text }}
                </div>

            {% endfor %}

        {% endif %}

    </div>

    <form action="/chat" method="POST">

        <input
            type="text"
            name="message"
            placeholder="Type your message..."
            autocomplete="off"
            required>

        <button type="submit">

            Send

        </button>

    </form>

</div>

</body>
</html>
